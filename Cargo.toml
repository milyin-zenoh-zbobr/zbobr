[workspace]
members = ["zbobr-lib", "zbobr"]
default-members = ["zbobr"]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
zbobr-lib = { path = "zbobr-lib" }
octocrab = { version = "0.49.5", features = ["rustls-ring"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1.89"
rmcp = { version = "0.15", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
schemars = "1"
anyhow = "1"
clap = { version = "4.5.58", features = ["derive", "env"] }
reqwest = { version = "0.13.2", features = ["json", "blocking", "cookies"] }
rustls = { version = "0.23", features = ["ring"] }
toml = "0.9.8"
tempfile = "3.25"
hostname = "0.4"
