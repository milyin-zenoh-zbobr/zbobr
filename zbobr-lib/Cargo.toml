[package]
name = "zbobr-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
octocrab = "0.44"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1.89"
rmcp = { version = "0.14", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
schemars = "1"

[dev-dependencies]
tempfile = "3"
anyhow = "1"
